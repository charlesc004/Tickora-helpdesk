services:
  tickora-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD:?Set SQL_PASSWORD in .env}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - tickora-sql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  tickora-web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__TickoraDb: "Server=tickora-sqlserver;Database=TickoraDb;User ID=sa;Password=${SQL_PASSWORD:?Set SQL_PASSWORD in .env};TrustServerCertificate=true"
      Demo__Password: ${DEMO_PASSWORD:?Set DEMO_PASSWORD in .env}
      PublicOrigin: http://localhost:5180
      AllowedHosts: localhost;127.0.0.1
    ports:
      - "127.0.0.1:5180:8080"
    volumes:
      - tickora-files:/app/App_Data
    depends_on:
      tickora-sqlserver:
        condition: service_healthy
volumes:
  tickora-sql:
  tickora-files:
